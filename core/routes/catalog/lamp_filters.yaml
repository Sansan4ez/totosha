route_id: corp_db.lamp_filters
route_family: corp_db.lamp_filters
route_kind: corp_table
authority: primary
title: Lamp structured filters
summary: Structured catalog filtering by power, flux, CCT, IP, voltage, dimensions, protection class,
  category, and mounting type.
when_to_use: >-
  Select when the user filters the catalog by explicit structured parameters: power, flux, CCT, IP,
  voltage, dimensions, protection class, category, or mounting type they actually stated.
schema_ref: lamp_filters.schema.json
topics:
- catalog
- filters
- lamp
- mounting_type
keywords:
- мощность
- световой поток
- цветовая температура
- ip
- напряжение
- габариты
- класс защиты
- тип крепления
- монтаж
patterns:
- подбери по параметрам
- светильники с ip
- светильники мощностью
- светильники с креплением
executor: corp_db_search
executor_args_template:
  kind: lamp_filters
  fuzzy: true
argument_hints:
  category: >-
    Extract category name only when the user names a real catalog category or series
    (e.g. LAD LED R500). Colloquial luminaire words — «прожектор», «светильник»,
    «лампа», «фонарь», «свет» — are not catalog categories: leave category empty for them.
  mounting_type: Extract mounting type as a free string.
  ip: Extract IP rating like IP65 or 65.
observability_labels:
  scope: lamp_filters
