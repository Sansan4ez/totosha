route_id: corp_db.lamp_filters
route_family: corp_db.lamp_filters
route_kind: corp_table
authority: primary
title: Lamp structured filters
summary: Structured catalog filtering by canonical business series, power, flux, CCT, IP, voltage,
  dimensions, protection class, category, and mounting type.
when_to_use: >-
  Select when the user asks to find lamp models matching explicit structured catalog parameters: canonical
  business series, power, flux, CCT, IP, voltage, dimensions, protection class, category, or mounting type.
  Do not select for series-wide knowledge facts such as which series use a material or tempered glass.
schema_ref: lamp_filters.schema.json
topics:
- catalog
- filters
- lamp
- mounting_type
keywords:
- серия
- 2ex
- мощность
- световой поток
- цветовая температура
- ip
- напряжение
- габариты
- класс защиты
- тип крепления
- монтаж
patterns:
- подбери по параметрам
- светильники с ip
- светильники мощностью
- светильники с креплением
executor: corp_db_search
executor_args_template:
  kind: lamp_filters
  fuzzy: true
argument_hints:
  category: >-
    Extract category name only when the user names a real catalog category. Colloquial luminaire words —
    «прожектор», «светильник», «лампа», «фонарь», «свет» — are not catalog categories: leave category empty for them.
  series: >-
    Choose only a canonical business series from the enum. A module number inside a SKU is not a series marker:
    LAD LED R320-2-... Ex belongs to LAD LED R320 Ex, not LAD LED R500 2Ex.
  mounting_type: Extract mounting type as a free string.
  ip: Extract IP rating like IP65 or 65.
observability_labels:
  scope: lamp_filters
