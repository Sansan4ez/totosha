route_id: corp_kb.company_common
route_family: corp_kb.company_common
route_kind: corp_table
authority: primary
title: Company common knowledge base
summary: Source-scoped company KB for contacts, website, legal details, address, service, warranty, canonical
  series overviews, and general company facts. Also the correct route for broad or multi-model
  certificate/declaration requests (e.g. certificates for several different lamp models or series
  named in one message) -- certificate_by_lamp_name only supports exactly one model/series at a time.
