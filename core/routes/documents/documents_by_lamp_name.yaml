route_id: corp_db.documents_by_lamp_name
route_family: corp_db.documents_by_lamp_name
route_kind: corp_table
authority: primary
title: Documents by lamp name
summary: Catalog-backed route for listing passports, certificates, manuals, IES files, and other linked
  documents for one or more named lamp models or series (up to five names per request). Use
  corp_kb.company_common only for broad document questions with no concrete model names.
when_to_use: Select when the user asks which documents (passports, certificates, manuals, IES) exist for one or
  more named lamp models or series (up to five names in one request).
schema_ref: documents_by_lamp_name.schema.json
topics:
- documents
- catalog
- lamp
keywords:
- документы на светильник
- паспорт на модель
- сертификаты на модель
- инструкция на модель
- ies для модели
- документы для серии
- какие документы есть
patterns:
- какие документы есть для модели
- покажи документы на светильник
- какие паспорта и сертификаты есть
executor: corp_db_search
executor_args_template:
  kind: lamp_documents_index
  limit: 3
argument_hints:
  names: List every lamp, model, or series name the user asks documents for (one array item per
    distinct name, up to five).
  document_type: Use passport, certificate, manual, or ies when the user clearly asks for one document
    subtype instead of the full list.
fallback_route_ids:
- corp_kb.company_common
- corp_db.catalog_lookup
cross_family_fallback_route_ids:
- corp_kb.company_common
- corp_db.catalog_lookup
observability_labels:
  scope: documents_by_lamp_name
