route_id: corp_db.certificate_by_lamp_name
route_family: corp_db.documents_by_lamp_name
route_kind: corp_table
authority: primary
title: Certificate by lamp name
summary: Catalog-backed route for certificate or declaration requests scoped to one or more named lamp
  models or series (up to five names per request, e.g. certificates for several models in one
  message). Use corp_kb.company_common only for broad certificate questions with no concrete
  model names.
when_to_use: Select when the user asks for certificates or declarations for one or more named lamp models or
  series (up to five names in one request).
schema_ref: certificate_by_lamp_name.schema.json
topics:
- documents
- catalog
- lamp
- certificate
keywords:
- сертификат
- сертификаты
- декларация
- декларации
- сертификат на модель
patterns:
- покажи сертификат на
- покажи сертификат для
- нужен сертификат на
executor: corp_db_search
executor_args_template:
  kind: lamp_documents_index
  limit: 3
  document_type: certificate
argument_hints:
  names: List every lamp, model, or series name whose certificate or declaration the user wants (one
    array item per distinct name, up to five).
fallback_route_ids:
- corp_db.documents_by_lamp_name
- corp_kb.company_common
cross_family_fallback_route_ids:
- corp_kb.company_common
observability_labels:
