name: Core Route Catalog

on:
  push:
    branches: [main]
    paths:
      - "core/**"
  pull_request:
    branches: [main]
    paths:
      - "core/**"

jobs:
  route-catalog-check:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: core
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: pip install --no-cache-dir -r requirements.txt

      - name: Route catalog invariants (RFC-028)
        run: python -m documents.route_catalog_check

      - name: Core test suite
        run: python -m pytest tests/ -q
