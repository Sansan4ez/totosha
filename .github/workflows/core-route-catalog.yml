name: Core Route Catalog

on:
  push:
    branches: [main]
    paths:
      - "core/**"
      - ".github/workflows/core-route-catalog.yml"
  pull_request:
    branches: [main]
    paths:
      - "core/**"
      - ".github/workflows/core-route-catalog.yml"

jobs:
  route-catalog-check:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: core
    steps:
      - uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: pip install --no-cache-dir -r requirements.txt

      - name: Route catalog invariants (RFC-028)
        run: python -m documents.route_catalog_check

      - name: Route catalog test suite
        # Keep this workflow scoped to the route catalog. The full core suite includes
        # deployment/integration tests (Docker sandbox and live services) that are not
        # valid on a generic hosted runner and belong in integration validation.
        run: >-
          python -m pytest -q
          tests/test_route_catalog_check.py
          tests/test_route_schema.py
          tests/test_route_schema_files.py
          tests/test_routing_catalog.py
          tests/test_routing_policy.py
          tests/test_route_selector_fake.py
