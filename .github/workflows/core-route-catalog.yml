name: Core Route Catalog

on:
  push:
    branches: [main]
    paths:
      - "core/**"
  pull_request:
    branches: [main]
    paths:
      - "core/**"

jobs:
  route-catalog-check:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: core
    steps:
      - uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: pip install --no-cache-dir -r requirements.txt

      - name: Route catalog invariants (RFC-028)
        run: python -m documents.route_catalog_check

      - name: Core unit test suite
        # test_sandbox.py is a Docker integration suite: it creates nested containers,
        # bind-mounts deployment host paths, and expects the production sandbox network.
        # Run it in deployment/integration validation, not on a generic hosted runner.
        run: python -m pytest tests/ -q --ignore=tests/test_sandbox.py
